# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-030-24 Wordpress magic (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a WordPress 6.5.4 site with plugins and a MySQL 8.0 database.
# The benchmark folder benchmarks/XBEN-030-24 is vendored unchanged, split between build/web/app/ and build/db/app/ (its mysql/ folder);
# the machine builds from an overlay of its own Dockerfile that bakes in a development flag,
# swapped for the player's flag at start by its ctf-entrypoint.sh.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-030-wordpress-magic

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.73.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [db]
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

  db:
    networks: { lab: 20 }
    services: [{ port: 3306, name: mysql }]
    resources: { cpus: 1, memory_mb: 1024 }
    docker:
      build: build/db

checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page /wp-login.php is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-030-24 (Wordpress magic) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Get the flag through remote code execution. Hint: /opt/flag.txt.
